<!doctype html>
<!-- Documento HTML en español: el lang orienta a lectores de pantalla y SEO. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: hace que la app sea responsive en móviles sin zoom extraño. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gestor de tareas fullstack con React y Express (proyecto académico)"
    />
    <title>Gestor de Tareas | Proyecto Fullstack</title>
  </head>
  <body>
    <!--
      Punto de montaje de React: createRoot('root') reemplaza TODO lo que
      haya dentro de este div cuando renderiza <App />.
    -->
    <div id="root"></div>
    <!--
      type="module" permite import/export. En dev Vite sirve los .jsx con
      transformación; en build genera los archivos con hash en dist/.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
